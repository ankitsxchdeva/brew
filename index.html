<style>

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{scrollbar-gutter:stable}
  :root{--page-w:100mm;--page-h:150mm}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--leading-body);
  }
  /* the theme flip: every surface shifts in unison on the one clock */
  *,*::before,*::after{transition:background-color var(--t),color var(--t),border-color var(--t)}

  .app{display:grid;grid-template-columns:60% 40%;height:100dvh;overflow:hidden}

  /* stage: the sheet is print output, so it keeps its own ink */
  .stage{display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
  .paper{width:var(--page-w);height:var(--page-h);background:#fff;border:var(--border-w) solid var(--border)}
  .paper svg{display:block}

  .panel{
    border-left:var(--border-w) solid var(--border);
    container-type:inline-size;display:flex;flex-direction:column;overflow:hidden;
  }
  .bar{
    display:flex;align-items:baseline;gap:var(--space-lg);
    padding:var(--space-md) 1.25em;border-bottom:var(--border-w) solid var(--border);
  }
  h1{
    margin:0;font-size:var(--text-display);font-weight:400;
    letter-spacing:var(--tracking-display);line-height:var(--leading-display);
  }
  .acts{margin-left:auto;display:flex;align-items:baseline;gap:1.25em}
  button{border:0;padding:0;background:none;font:inherit;cursor:pointer}
  .act{font-size:var(--text-title);color:var(--accent);transition:color var(--t)}
  .act:hover{color:var(--accent-hover)}
  .quiet{font-size:var(--text-small);color:var(--muted);transition:color var(--t)}
  .quiet:hover{color:var(--fg)}

  .scroll{flex:1;overflow-y:auto;padding:var(--space-lg) 1.25em var(--space-xl)}
  section + section{margin-top:var(--space-lg)}
  h2{margin:0 0 var(--space-md);font-size:var(--text-title);font-weight:700}

  .f{display:block;margin-bottom:var(--space-md)}
  .f span{display:block;margin-bottom:var(--space-xs);color:var(--muted);font-size:var(--text-label)}
  input,select{
    width:100%;padding:0.4em 0.6em;
    border:var(--border-w) solid var(--border);border-radius:var(--radius-hairline);
    background:transparent;color:var(--fg);font:inherit;font-size:var(--text-small);
    transition:border-color var(--t);
  }
  input:hover,select:hover{border-color:var(--muted)}
  input:focus,select:focus{border-color:var(--accent);outline:none}
  input::placeholder{color:var(--muted);opacity:var(--dim)}

  .row{display:grid;gap:0 var(--space-md)}
  .row.c2{grid-template-columns:1fr 1fr}
  .row.c4{grid-template-columns:repeat(4,1fr)}

  /* steps are a dense row list: hairlines are structure here, not separation */
  .step{padding:0.65em 0;border-bottom:var(--border-w) solid var(--border)}
  .step:first-child{border-top:var(--border-w) solid var(--border)}
  .step-head{display:flex;align-items:baseline;gap:var(--space-md);margin-bottom:var(--space-sm)}
  .step-head select{width:auto;min-width:11em}
  .s-acts{margin-left:auto;display:flex;gap:0.9em}
  .s-acts button{
    padding:var(--space-xs);margin:calc(var(--space-xs) * -1);
    font-size:var(--text-meta);color:var(--muted);transition:color var(--t);
  }
  .s-acts button:hover{color:var(--accent-hover)}
  .sgrid{display:grid;gap:0 var(--space-md);grid-template-columns:1fr 1fr}
  .sgrid .wide{grid-column:span 2}
  @container (min-width:500px){
    .sgrid{grid-template-columns:100px 120px 1fr 1fr}
    .sgrid .wide{grid-column:auto}
  }

  .hint{margin:calc(var(--space-sm) * -1) 0 0;color:var(--muted);font-size:var(--text-meta)}
  .warn{margin:var(--space-md) 0 0;color:var(--muted);font-size:var(--text-meta);font-style:italic}
  #btn-add{margin-top:var(--space-md)}

  @media (max-width:900px){
    .app{grid-template-columns:1fr;height:auto;overflow:visible}
    .stage{padding:var(--space-md)}
    .paper{zoom:.62}
    .panel{border-left:0;border-top:var(--border-w) solid var(--border)}
  }

  #print-root{display:none}
  @media print{
    html,body{background:#fff;margin:0;padding:0}
    .app{display:none !important}
    #print-root{
      display:block;position:fixed;left:0;top:0;
      width:var(--page-w);height:var(--page-h);overflow:hidden;background:#fff;
    }
    #print-root svg{display:block;width:var(--page-w);height:var(--page-h)}
  }
</style>
<style id="page-setup">@page{size:100mm 150mm;margin:0}</style>
</head>
<body>
<div class="app">
  <main class="stage"><div class="paper" id="paper"></div></main>

  <aside class="panel">
    <header class="bar">
      <h1>brew sheet</h1>
      <div class="acts">
        <button id="theme" class="quiet">dark</button>
        <button id="btn-png" class="act">save png</button>
        <button id="btn-print" class="act">print</button>
      </div>
    </header>

    <div class="scroll">
      <section>
        <h2>sheet</h2>
        <label class="f"><span>page size</span><select data-k="page" id="page-size"></select></label>
      </section>

      <section>
        <h2>recipe</h2>
        <label class="f"><span>name</span><input data-k="name" autocomplete="off"></label>
        <div class="row c2">
          <label class="f"><span>brewer</span><input data-k="brewer" autocomplete="off"></label>
          <label class="f"><span>grind</span><input data-k="grind" autocomplete="off"></label>
        </div>
        <div class="row c4">
          <label class="f"><span>coffee g</span><input data-k="coffee" inputmode="decimal" autocomplete="off"></label>
          <label class="f"><span>water g</span><input data-k="water" inputmode="decimal" autocomplete="off"></label>
          <label class="f"><span>ratio</span><input data-k="ratio" placeholder="auto" autocomplete="off"></label>
          <label class="f"><span>temp</span><input data-k="temp" autocomplete="off"></label>
        </div>
        <p class="hint">a blank ratio is computed from coffee and water.</p>
      </section>

      <section>
        <h2>timeline</h2>
        <div id="steps"></div>
        <button class="act" id="btn-add">add step</button>
        <p class="warn" id="warn" hidden>the timeline runs past the sheet, shorten a note or remove a step.</p>
      </section>

      <section>
        <button class="quiet" id="btn-reset">load the sample recipe</button>
      </section>
    </div>
  </aside>
</div>
<div id="print-root"></div>

<script>
"use strict";

/* ============================ theme ============================ */

const root = document.documentElement;
const TKEY = "brewsheet.theme";
try{
  const saved = localStorage.getItem(TKEY);
  if(saved === "light" || saved === "dark") root.dataset.theme = saved;
}catch(e){ /* storage unavailable: system theme still applies */ }

const themeBtn = document.getElementById("theme");
function effectiveTheme(){
  if(root.dataset.theme === "dark" || root.dataset.theme === "light") return root.dataset.theme;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function paintTheme(){ themeBtn.textContent = effectiveTheme() === "dark" ? "light" : "dark"; }
paintTheme();
themeBtn.addEventListener("click", ()=>{
  root.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark";
  try{ localStorage.setItem(TKEY, root.dataset.theme); }catch(e){}
  paintTheme();
});

/* ============================ state ============================ */

const SAMPLE = {
  page:"label",
  name:"Hoffman - The Daily Driver",
  brewer:"Hario Switch",
  grind:"medium-fine",
  coffee:"15",
  water:"250",
  ratio:"",
  temp:"100 °C",
  steps:[
    {t:"0:00", type:"close", title:"Close the switch", d:"", w:""},
    {t:"0:00", type:"pour",  title:"Pour to 250 g",    d:"All of it, straight in.", w:"250"},
    {t:"2:00", type:"note",  title:"Stir and swirl",   d:"Settle the bed flat.", w:""},
    {t:"2:05", type:"open",  title:"Open the switch",  d:"Let it drain out.", w:""}
  ]
};

const KEY = "brewsheet.v3";
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(SAMPLE);
    const v = JSON.parse(raw);
    if(!v || !Array.isArray(v.steps)) return structuredClone(SAMPLE);
    return Object.assign(structuredClone(SAMPLE), v);
  }catch(e){ return structuredClone(SAMPLE); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ============================ type ============================ */

const DISPLAY = "Lato, Verdana, Helvetica, sans-serif";
const TEXT    = "Lato, Verdana, Helvetica, sans-serif";

const mc = document.createElement("canvas").getContext("2d");
/* all geometry is in millimetres; measure at 10x for precision */
function tw(t, size, fam, weight, track){
  mc.font = (weight||400) + " " + (size*10) + "px " + fam;
  return mc.measureText(String(t)).width/10 + (track||0)*Math.max(0,String(t).length-1);
}
function wrap(t, maxW, size, fam, weight, track){
  const words = String(t||"").split(/\s+/).filter(Boolean);
  const out=[]; let cur="";
  for(const w of words){
    const test = cur ? cur+" "+w : w;
    if(!cur || tw(test,size,fam,weight,track) <= maxW) cur = test;
    else { out.push(cur); cur = w; }
  }
  if(cur) out.push(cur);
  return out;
}
function fitSize(t, maxW, hi, lo, fam, weight, trackRatio){
  for(let s=hi; s>lo; s-=0.05){
    if(tw(t, s, fam, weight, s*(trackRatio||0)) <= maxW) return s;
  }
  return lo;
}
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function T(x,y,str,{size=3,fam=TEXT,weight=400,track=0,anchor="start"}={}){
  if(str==null || str==="") return "";
  return '<text x="'+r(x)+'" y="'+r(y)+'" font-family="'+fam+'" font-size="'+r(size)+
    '" font-weight="'+weight+'"'+(track?' letter-spacing="'+r(track)+'"':"")+
    (anchor!=="start"?' text-anchor="'+anchor+'"':"")+'>'+esc(str)+'</text>';
}
const r = n => Math.round(n*1000)/1000;
function line(x1,y1,x2,y2,w){
  return '<line x1="'+r(x1)+'" y1="'+r(y1)+'" x2="'+r(x2)+'" y2="'+r(y2)+
    '" stroke="#000" stroke-width="'+r(w)+'" stroke-linecap="butt"/>';
}

/* ============================ sheet ============================ */

/* page sizes: the sheet is authored at 100 mm wide; every measure scales by pk */
const PAGES = {
  label:  {name:"label 100 × 150 mm",      w:100,   h:150},
  label6: {name:"label 4 × 6 in",          w:101.6, h:152.4},
  a6:     {name:"a6 — 105 × 148 mm",       w:105,   h:148},
  a5:     {name:"a5 — 148 × 210 mm",       w:148,   h:210},
  a4:     {name:"a4 — 210 × 297 mm",       w:210,   h:297},
  letter: {name:"us letter — 8.5 × 11 in", w:215.9, h:279.4}
};
let ML = 7, MR = 93, CW = MR - ML;          // margins, content width (set per page in renderLabel)
let RAIL = 15.4, TX = 19.8, TIME_E = 12.6;  // timeline rail and columns

function ratioOf(){
  if(S.ratio && S.ratio.trim()) return S.ratio.trim();
  const c = parseFloat(S.coffee), w = parseFloat(S.water);
  if(!c || !w) return "";
  return "1:" + (Math.round((w/c)*10)/10).toString().replace(/\.0$/,"");
}

function marker(cy, type, k){
  const g = [];
  k = Math.max(0.8, Math.min(1.1, k||1));
  if(type==="pour"){
    g.push('<circle cx="'+r(RAIL)+'" cy="'+r(cy)+'" r="'+r(1.35*k)+'" fill="#000"/>');
  }else if(type==="note"){
    g.push('<circle cx="'+r(RAIL)+'" cy="'+r(cy)+'" r="'+r(1.2*k)+'" fill="#fff" stroke="#000" stroke-width="'+r(0.32*k)+'"/>');
  }else{
    // the switch itself: a lever with the knob down (shut) or up (open)
    const open = type==="open";
    g.push('<rect x="'+r(RAIL-1.25*k)+'" y="'+r(cy-2.05*k)+'" width="'+r(2.5*k)+'" height="'+r(4.1*k)+'" rx="'+r(1.25*k)+'" fill="#fff" stroke="#000" stroke-width="'+r(0.32*k)+'"/>');
    g.push('<circle cx="'+r(RAIL)+'" cy="'+r(cy + (open ? -0.95 : 0.95)*k)+'" r="'+r(0.72*k)+'" fill="#000"/>');
  }
  return g.join("");
}

function layoutSteps(steps, s, y0, extra, pk){
  const tS = 3.05*s*pk, tLH = 3.5*s*pk, dS = 2.45*s*pk, dLH = 2.9*s*pk, gap = 3.05*s*pk + (extra||0);
  const blocks = [];
  let y = y0;
  for(const st of steps){
    const hasW = String(st.w||"").trim() !== "";
    const titleMax = MR - TX - (hasW ? 13*pk : 0);
    const tl = wrap(st.title, titleMax, tS, TEXT, 700, 0);
    const dl = st.d ? wrap(st.d, MR - TX, dS, TEXT, 400, 0) : [];
    const base = y;
    blocks.push({st, base, tl, dl, tS, tLH, dS, dLH, cy: base - tS*0.33, hasW});
    y = base + tLH*(tl.length-1) + (dl.length ? 0.75*s*pk + dLH*dl.length : 0) + gap;
  }
  return {blocks, bottom: y - gap};
}

function renderLabel(px){
  const P = [];
  const pg = PAGES[S.page] || PAGES.label;
  const pk = pg.w/100;
  ML = 7*pk; MR = pg.w - 7*pk; CW = MR - ML;
  RAIL = 15.4*pk; TX = 19.8*pk; TIME_E = 12.6*pk;
  const name = String(S.name||"").trim().toUpperCase();

  /* --- name, the one loud thing on the sheet --- */
  let nSize = 8.6*pk, nLines = [];
  for(nSize = 8.6*pk; nSize > 4.2*pk; nSize -= 0.1*pk){
    nLines = wrap(name, CW, nSize, DISPLAY, 700, nSize*0.045);
    if(nLines.length <= 2) break;
  }
  const nLH = nSize*1.02;
  let y = 12.4*pk;
  nLines.forEach((ln,i)=>{
    P.push(T(ML, y + i*nLH, ln, {size:nSize, fam:DISPLAY, weight:700, track:nSize*0.045}));
  });
  y = y + (nLines.length-1)*nLH;

  /* --- the four numbers you check before you start --- */
  let ry = y + 3.4*pk;
  P.push(line(ML, ry, MR, ry, 0.3*pk));

  const cells = [
    [String(S.coffee||"").trim() ? S.coffee.trim()+" g" : "", "coffee"],
    [String(S.water||"").trim()  ? S.water.trim()+" g"  : "", "water"],
    [ratioOf(), "ratio"],
    [String(S.temp||"").trim(), "temperature"]
  ];
  const colW = CW/4;
  const vBase = ry + 6.9*pk;
  cells.forEach((c,i)=>{
    const x = ML + i*colW;
    const v = c[0] || "N/A";
    const sz = fitSize(v, colW-2.2*pk, 4.7*pk, 2.5*pk, DISPLAY, 700, 0);
    P.push(T(x, vBase, v, {size:sz, fam:DISPLAY, weight:700}));
    P.push(T(x, vBase+3.0*pk, c[1], {size:2.1*pk, fam:TEXT, weight:400, track:0.16*pk}));
  });

  const bBase = vBase + 7.1*pk;
  P.push(T(ML, bBase, S.brewer, {size:3.0*pk, fam:TEXT, weight:700}));
  const grind = String(S.grind||"").trim();
  if(grind) P.push(T(MR, bBase, grind + " grind", {size:3.0*pk, fam:TEXT, weight:400, anchor:"end"}));

  const ry2 = bBase + 3.2*pk;
  P.push(line(ML, ry2, MR, ry2, 0.55*pk));

  /* --- timeline: grow to fill, shrink so it never spills --- */
  const steps = (S.steps||[]).filter(st => (st.title||st.d||st.t));
  const floor = pg.h - 7*pk;
  const y0 = ry2 + 6.2*pk;

  let s = 0.72, L = layoutSteps(steps, s, y0, 0, pk);
  for(let t = 1.55; t >= 0.72; t -= 0.02){          // biggest type that still fits
    const c = layoutSteps(steps, t, y0, 0, pk);
    if(c.bottom <= floor){ s = t; L = c; break; }
  }
  const overflow = L.bottom > floor + 0.5;
  if(!overflow && L.blocks.length > 1){             // then let the steps breathe
    const extra = Math.min((floor - 1*pk - L.bottom)/(L.blocks.length-1), 14*pk);
    if(extra > 0.1) L = layoutSteps(steps, s, y0, extra, pk);
  }
  if(!overflow){                                    // optically centre whatever air is left
    const sh = (floor - L.bottom) * 0.45;
    if(sh > 0.5){ L.blocks.forEach(b => { b.base += sh; b.cy += sh; }); L.bottom += sh; }
  }

  if(L.blocks.length){
    const first = L.blocks[0].cy, last = L.blocks[L.blocks.length-1].cy;
    if(last > first) P.push(line(RAIL, first, RAIL, last, 0.3*pk));
  }
  for(const b of L.blocks){
    const mk = Math.max(0.8, Math.min(1.1, s)) * pk;
    // clear the rail where a marker sits
    const mh = ((b.st.type==="open"||b.st.type==="close") ? 5.4 : 2.9) * mk;
    P.push('<rect x="'+r(RAIL-1.5*mk)+'" y="'+r(b.cy-mh/2)+'" width="'+r(3*mk)+'" height="'+r(mh)+'" fill="#fff"/>');
    P.push(marker(b.cy, b.st.type, mk));
    if(String(b.st.t||"").trim())
      P.push(T(TIME_E, b.base, b.st.t.trim(), {size:2.85*s*pk, fam:DISPLAY, weight:700, anchor:"end"}));
    if(b.hasW)
      P.push(T(MR, b.base, String(b.st.w).trim()+" g", {size:3.0*s*pk, fam:DISPLAY, weight:700, anchor:"end"}));
    b.tl.forEach((ln,i)=> P.push(T(TX, b.base + i*b.tLH, ln, {size:b.tS, fam:TEXT, weight:700})));
    let dy = b.base + b.tLH*(b.tl.length-1) + 0.75*s*pk + b.dS*0.95;
    b.dl.forEach((ln,i)=> P.push(T(TX, dy + i*b.dLH, ln, {size:b.dS, fam:TEXT, weight:400})));
  }

  const size = px
    ? 'width="'+px.w+'" height="'+px.h+'"'
    : 'width="'+pg.w+'mm" height="'+pg.h+'mm"';
  // an <img>-rasterised SVG cannot reach the document's @font-face, so carry them in
  const faces = px ? '<defs><style>'+document.getElementById("lato").textContent+'</style></defs>' : '';
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" '+size+' viewBox="0 0 '+pg.w+' '+pg.h+'" '+
    'shape-rendering="geometricPrecision" text-rendering="geometricPrecision">'+faces+
    '<rect width="'+pg.w+'" height="'+pg.h+'" fill="#fff"/><g fill="#000">'+P.join("")+'</g></svg>';

  return {svg, overflow};
}

/* ============================ preview ============================ */

const paper = document.getElementById("paper");
const warn  = document.getElementById("warn");
const pageSetup = document.getElementById("page-setup");

function render(){
  const pg = PAGES[S.page] || PAGES.label;
  root.style.setProperty("--page-w", pg.w+"mm");
  root.style.setProperty("--page-h", pg.h+"mm");
  pageSetup.textContent = "@page{size:"+pg.w+"mm "+pg.h+"mm;margin:0}";
  const out = renderLabel(null);
  paper.innerHTML = out.svg;
  document.getElementById("print-root").innerHTML = out.svg;
  warn.hidden = !out.overflow;
  fit();
}

function fit(){
  const pg = PAGES[S.page] || PAGES.label;
  const probe = document.createElement("div");
  probe.style.cssText = "position:absolute;visibility:hidden;width:100mm";
  document.body.appendChild(probe);
  const mm = probe.getBoundingClientRect().width / 100;
  probe.remove();
  if(window.innerWidth <= 900){ paper.style.zoom = ""; return; }
  const stage = paper.parentElement, PAD = 18;
  const z = Math.max(0.3, Math.min(
    1.75,
    (stage.clientHeight - PAD*2) / (pg.h*mm),
    (stage.clientWidth  - PAD*2) / (pg.w*mm)
  ));
  paper.style.zoom = String(z);
}
window.addEventListener("resize", fit);

/* ============================ editor ============================ */

const TYPES = [["pour","pour"],["close","close the switch"],["open","open the switch"],["note","note"]];
const stepsEl = document.getElementById("steps");

document.getElementById("page-size").innerHTML = Object.keys(PAGES).map(k =>
  '<option value="'+k+'">'+PAGES[k].name+'</option>').join("");

function buildSteps(){
  stepsEl.innerHTML = (S.steps||[]).map((st,i)=>
    '<div class="step" data-i="'+i+'">'+
      '<div class="step-head">'+
        '<select data-f="type" aria-label="step type">'+TYPES.map(t=>
          '<option value="'+t[0]+'"'+(st.type===t[0]?" selected":"")+'>'+t[1]+'</option>').join("")+
        '</select>'+
        '<div class="s-acts">'+
          '<button data-a="up">up</button>'+
          '<button data-a="down">down</button>'+
          '<button data-a="del">remove</button>'+
        '</div>'+
      '</div>'+
      '<div class="sgrid">'+
        '<label class="f"><span>time</span><input data-f="t" value="'+esc(st.t)+'" placeholder="0:00" autocomplete="off"></label>'+
        '<label class="f"><span>water so far, g</span><input data-f="w" value="'+esc(st.w)+'" inputmode="decimal" autocomplete="off"></label>'+
        '<label class="f wide"><span>step</span><input data-f="title" value="'+esc(st.title)+'" autocomplete="off"></label>'+
        '<label class="f wide"><span>note</span><input data-f="d" value="'+esc(st.d)+'" autocomplete="off"></label>'+
      '</div>'+
    '</div>').join("");
}

function fillFields(){
  document.querySelectorAll("[data-k]").forEach(el => { el.value = S[el.dataset.k] ?? ""; });
}

document.addEventListener("input", e=>{
  const el = e.target;
  if(el.dataset.k){ S[el.dataset.k] = el.value; save(); render(); return; }
  const f = el.dataset.f;
  if(f){
    const i = +el.closest(".step").dataset.i;
    S.steps[i][f] = el.value; save(); render();
  }
});
document.addEventListener("change", e=>{
  if(e.target.dataset.f === "type"){
    const i = +e.target.closest(".step").dataset.i;
    S.steps[i].type = e.target.value; save(); render();
  }
});
stepsEl.addEventListener("click", e=>{
  const b = e.target.closest("button[data-a]");
  if(!b) return;
  const i = +b.closest(".step").dataset.i;
  const a = b.dataset.a;
  if(a==="del") S.steps.splice(i,1);
  if(a==="up"   && i>0) S.steps.splice(i-1,0,S.steps.splice(i,1)[0]);
  if(a==="down" && i<S.steps.length-1) S.steps.splice(i+1,0,S.steps.splice(i,1)[0]);
  save(); buildSteps(); render();
  // the DOM reordered: put focus back on the same control
  const moved = stepsEl.children[a==="up" ? Math.max(0,i-1) : a==="down" ? Math.min(S.steps.length-1,i+1) : Math.min(S.steps.length-1,i)];
  if(moved){
    const target = a==="del" ? moved.querySelector('input[data-f="t"]') : moved.querySelector('button[data-a="'+a+'"]');
    if(target) target.focus({preventScroll:true});
  }
});
document.getElementById("btn-add").addEventListener("click", ()=>{
  S.steps.push({t:"", type:"pour", title:"", d:"", w:""});
  save(); buildSteps(); render();
  const last = stepsEl.lastElementChild;
  if(last) last.querySelector('input[data-f="t"]').focus({preventScroll:true});
});
document.getElementById("btn-reset").addEventListener("click", ()=>{
  S = structuredClone(SAMPLE); save(); fillFields(); buildSteps(); render();
});

/* ============================ output ============================ */

document.getElementById("btn-print").addEventListener("click", ()=> window.print());

function slug(){
  return (String(S.name||"brew-sheet").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "brew-sheet");
}
const pngBtn = document.getElementById("btn-png");
pngBtn.addEventListener("click", ()=>{
  const pg = PAGES[S.page] || PAGES.label;
  const W = Math.round(pg.w*300/25.4), H = Math.round(pg.h*300/25.4);   // 300 dpi
  const svg = renderLabel({w:W, h:H}).svg;
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0,0,W,H);
    g.drawImage(img,0,0,W,H);
    // thermal printers are 1-bit: no grey, no dithering
    const d = g.getImageData(0,0,W,H), p = d.data;
    for(let i=0;i<p.length;i+=4){
      const v = (p[i]*0.299 + p[i+1]*0.587 + p[i+2]*0.114) < 150 ? 0 : 255;
      p[i]=p[i+1]=p[i+2]=v; p[i+3]=255;
    }
    g.putImageData(d,0,0);
    c.toBlob(b=>{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = slug()+"-"+Math.round(pg.w)+"x"+Math.round(pg.h)+".png";
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
      pngBtn.textContent = "saved";
      setTimeout(()=>{ pngBtn.textContent = "save png"; }, 1500);
    },"image/png");
  };
  img.onerror = ()=>{ pngBtn.textContent = "png failed, print still works"; };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
});

/* ============================ go ============================ */
fillFields();
buildSteps();
render();
if(document.fonts){
  // canvas measurement is only right once the real faces are in
  Promise.all([document.fonts.load("400 100px Lato"), document.fonts.load("700 100px Lato")])
    .then(render).catch(()=>{});
}
</script>
</body>
</html>
